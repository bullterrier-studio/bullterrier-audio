# Known vulnerabilities in the locked dependencies (pip-audit), code scanning (CodeQL), and the dependencies a pull
# request adds (dependency review). Part of every CI run (ci.yml calls it,
# so a known vulnerability stops the build and the release), and on its own weekly, because advisories appear without
# any change here, and by hand.
# No `concurrency`: called from ci.yml, a group shared with a scheduled run could cancel CI's pending security job.
name: Security

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Audit the locked dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      # the tools only: the audit reads the lock file, so the package is not built. UV_NO_SYNC reaches the `uv run` poe
      # runs each command with.
      - name: Install the locked development tools, not the package
        run: uv sync --locked --no-install-project
      - name: Python dependencies (pip-audit) against known vulnerabilities
        run: uv run --no-sync poe audit
        env:
          UV_NO_SYNC: "1"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the findings to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # reads the source as it is (build-mode none): nothing is compiled for the analysis
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  dependency-review:
    name: Dependency review
    # called from ci.yml the event is ci.yml's: a pull request runs this, a push, tag, merge queue or schedule skips
    # it (a skipped job does not fail the workflow), since only a pull request has a base to compare against
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
