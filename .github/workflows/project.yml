# This project's own CI jobs (a test in another language, a second build target, a scheduled check): ci.yml runs this
# file beside the template's checks, and ci-ok waits for it. The file is the project's: an update never
# changes it. Replace the placeholder job with the project's own; the file needs at least one.
name: Project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # `poe check` leaves this to `full` and CI (a second Rust profile, 15 s warm): the opposite configuration of the workspace gates,
  # a Rust user's `default-features = false`.
  no-default-features:
    name: Core without default features
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install the locked dependencies (builds the Rust extension)
        run: uv sync --locked
      - name: Lint and test the core without its default onnx feature
        run: uv run --locked poe rust-no-default-features

  # The Rust tests that need the ONNX Runtime library and the models (`#[ignore]`d in `check`; the ensemble test needs the
  # four fine-tuned ones, 1.26 GB). `bt-audio install --ensemble` downloads them on the first run (verified against the pinned SHA-256); the
  # cache keeps them under the catalogue's and the runtime's source, which pin the files.
  models:
    name: Tests with the installed models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install --no-self-update && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bt-audio
          key: bt-audio-${{ hashFiles('crates/core/src/models/catalogue.rs', 'crates/core/src/models/runtime.rs') }}
      - name: Install the locked dependencies (builds the Rust extension)
        run: uv sync --locked
      # Installed first, by the command a user runs: the tests run in parallel and several need the runtime and the model
      # present before they start (a test that downloads would race the others).
      - name: Install the ONNX Runtime and the models (bt-audio install --ensemble)
        run: uv run --locked bt-audio install --yes --ensemble
      - name: Rust and Python tests that need the models
        run: uv run --locked poe rust-test-models
