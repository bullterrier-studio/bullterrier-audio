[package]
name = "bullterrier-audio"
description = "The core of bullterrier-audio: its logic, in pure Rust."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "bullterrier_audio"
# no doctests: edition 2024 merges them into one more executable (built and scanned on macOS), and the tests of
# tests/it/ are the examples.
# Set it to true only for a public item whose docs need a runnable bullterrier-audio.
doctest = false

[features]
# Running models through ONNX Runtime (`models`): the library is loaded at run time, none is bundled. On by default because
# the bindings (and so the wheel) need it and name the core only as `bullterrier-audio.workspace` (tests/tools/test_project_wiring.py
# pins that line, so the bindings cannot enable a feature of their own); a Rust user who wants no network stack sets
# `default-features = false`.
default = ["onnx"]
onnx = ["dep:dirs", "dep:flate2", "dep:ort", "dep:tar", "dep:ureq", "dep:zip"]

[dependencies]
dirs = { workspace = true, optional = true }
ebur128 = "0.1.11"
flacenc.workspace = true
flate2 = { workspace = true, optional = true }
hound.workspace = true
ort = { workspace = true, optional = true }
realfft.workspace = true
rubato.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
symphonia.workspace = true
tempfile.workspace = true
tar = { workspace = true, optional = true }
thiserror.workspace = true
ureq = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
jsonschema.workspace = true
proptest.workspace = true

[lints]
workspace = true
